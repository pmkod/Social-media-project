_format_version: "3.0"
_transform: true

services:
  - name: authentication-service
    url: http://authentication-service:8001
    routes:
      - name: authentication-routes
        paths:
          - /authentication
        strip_path: false

  - name: user-service
    url: http://user-service:8002
    routes:
      - name: user-routes
        paths:
          - /users
        strip_path: false

  - name: content-service
    url: http://content-service:8003
    routes:
      - name: post-routes
        paths:
          - /posts
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      exposed_headers:
        - Authorization
      max_age: 3600
