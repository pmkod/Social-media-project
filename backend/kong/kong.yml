_format_version: "3.0"
_transform: true

services:
  - name: authentication-service
    url: http://authentication-service:8081
    routes:
      - name: authentication-routes
        paths:
          - /authentication
        strip_path: false

  - name: user-service
    url: http://user-service:8082
    routes:
      - name: user-routes
        paths:
          - /users
        strip_path: false
    plugins:
      - name: jwt-auth
        config:
          secret: __JWT_SECRET__
          issuer: social-media-app
          user_id_claim: userId
          upstream_header: X-User-Id

  - name: content-service
    url: http://content-service:8083
    routes:
      - name: post-routes
        paths:
          - /posts
        strip_path: false
    plugins:
      - name: jwt-auth
        config:
          secret: __JWT_SECRET__
          issuer: social-media-app
          user_id_claim: userId
          upstream_header: X-User-Id

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      exposed_headers:
        - Authorization
      max_age: 3600
